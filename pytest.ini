[pytest]
testpaths = tests
addopts = -v --tb=short --strict-markers
markers =
    wifi: station_WiFi Wi-Fi tests (DZ-14 Part A)
    ble: SENTRY-BLE tests (DZ-14 Part B)

# Show INFO-level logs live in the console as tests run, not only in the
# "Captured log" section pytest normally prints for failed tests.
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
