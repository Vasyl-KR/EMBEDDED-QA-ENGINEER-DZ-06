[pytest]
testpaths = tests
addopts = -v --tb=short --strict-markers
markers =
    smoke: bring-up checks - the framework talks to the board (version, unknown command, login rules, whoami)
    ota: OTA updates, rollback, data persistence (PRD section 5)
    sonar: active sonar HC-SR04 (PRD section 8)
    guard: SENTRY Guard (PRD section 10, firmware 2.3.0 only)
    positive: happy-path scenarios (valid input, expected behaviour)
    negative: invalid input, error codes, access rules
    regression: must pass on every firmware version (2.1.0 behaviour must not get worse)
    target: needs a static target in front of the sensor at a known distance D (SWM_TARGET_CM)
    since(version): run only on firmware >= version, e.g. since("2.3.0")
    until(version): run only on firmware < version, e.g. until("2.3.0")

# Everything (INFO steps/commands/answers + DEBUG raw lines) is captured into the HTML report for
# every test, passed ones included; the console shows INFO live.
log_level = DEBUG
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
